<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Gradivus Browser Fixture</title>
		<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23f5c542'/%3E%3Cpath d='M4 4h8v8H4z' fill='%23111'/%3E%3C/svg%3E" />
		<style>
			body { margin: 0; padding: 32px; color: #141414; background: #fff; font: 16px/1.5 system-ui, sans-serif; }
			main { max-width: 720px; margin: 0 auto; }
			.fixture-target { display: block; width: 100%; min-height: 96px; margin: 16px 0; padding: 20px; color: #fff; background: #111; border: 4px solid #f5c542; border-radius: 8px; text-align: left; font: inherit; }
			.fixture-target:focus-visible, .fixture-target:hover { outline: 4px solid #005fcc; outline-offset: 4px; }
			#fixture-secondary { color: #111; background: #f5c542; border-color: #111; }
			#fixture-output { display: block; min-height: 24px; margin-top: 16px; font-weight: 700; }
		</style>
	</head>
	<body>
		<main>
			<h1>Browser workspace ready</h1>
			<button type="button" id="fixture-action" class="fixture-target">Interact with primary target</button>
			<button type="button" id="fixture-secondary" class="fixture-target">Inspect secondary target</button>
			<button type="button" id="fixture-navigate" class="fixture-target">Navigate from broker click</button>
			<label>Password <input id="fixture-password" type="password" autocomplete="off" /></label>
			<label>Upload <input id="fixture-file" type="file" /></label>
			<output id="fixture-output">Waiting</output>
		</main>
		<script>
			document.querySelector("#fixture-action").addEventListener("click", () => {
				document.querySelector("#fixture-output").textContent = "Connected";
			});
			document.querySelector("#fixture-secondary").addEventListener("click", () => {
				document.querySelector("#fixture-output").textContent = "Secondary connected";
			});
			document.querySelector("#fixture-navigate").addEventListener("click", () => {
				const destination = new URL(location.href);
				destination.searchParams.set("broker-click", "1");
				location.href = destination.toString();
			});
		</script>
	</body>
</html>
